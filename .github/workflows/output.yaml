name: Output information
on: workflow_dispatch # we only want this Workflow to be trigger manually
jobs:
  info: # we are defining just 1 job named "info"
    runs-on: ubuntu-latest # this job runs in ubuntu
    steps:
      - name: Output GitHub context # the name for this first step
        run: echo "${{ toJSON(github) }}" # the data object we are accessing within github
